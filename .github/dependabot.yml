version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 github actions "
          include: scope
      groups:
        patch-and-minor:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
        major:
          patterns:
            - "*"
          update-types:
            - "major"

    - package-ecosystem: "pip"
      directory: "/"
      open-pull-requests-limit: 2

      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 py dev "
          include: scope
      groups:
        patch-and-minor:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
        major:
          patterns:
            - "*"
          update-types:
            - "major"
      ignore:
        # Pinned to exact version 8.0.0 in pyproject.toml - requires manual review to update
        - dependency-name: "importlib-metadata"

    - package-ecosystem: "terraform"
      directories:
          - "/module"
          - "/stacks/localstack"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 terraform "
          include: scope
      groups:
        patch-and-minor:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
        major:
          patterns:
            - "*"
          update-types:
            - "major"

    - package-ecosystem: "docker"
      directory: "/"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 docker "
          include: scope
      groups:
        patch-and-minor:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
        major:
          patterns:
            - "*"
          update-types:
            - "major"
