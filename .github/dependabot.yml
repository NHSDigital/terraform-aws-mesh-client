version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 github actions "
          include: scope

    - package-ecosystem: "pip"
      directory: "/"
      open-pull-requests-limit: 2

      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 py dev "
          include: scope

    - package-ecosystem: "terraform"
      directories:
          - "/module"
          - "/stacks/localstack"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 terraform "
          include: scope

    - package-ecosystem: "docker"
      directory: "/"
      open-pull-requests-limit: 2
      schedule:
          interval: "daily"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "MESH-2092 docker "
          include: scope
